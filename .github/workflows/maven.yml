name: Build IDreamOfEasy Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sf-idreamofeasy-build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: "1.0.3"
  OUTPUT_NAME: "SF_IDreamOfEasy1.0.3.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IDreamOfEasy
        uses: actions/checkout@v6
        with:
          path: idreamofeasy
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install checksum-verified Apache Maven 3.10.0
        run: bash idreamofeasy/scripts/install_maven_3_10.sh
      - name: Verify Legacy fork source policy
        working-directory: idreamofeasy
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number -E 'net\.guizhanss|GuizhanLibPlugin|GuizhanUpdater|鬼斩' pom.xml src/main/java src/main/resources; then
            echo 'GuizhanLib or Gugu-only runtime code is still present.'
            exit 1
          fi
          grep -q '^folia-supported: true$' src/main/resources/plugin.yml
          grep -Fq '<version>1.0.3</version>' pom.xml
          grep -Fq '<paper.version>1.21.11-R0.1-SNAPSHOT</paper.version>' pom.xml
          grep -Fq '<finalName>SF_IDreamOfEasy${project.version}</finalName>' pom.xml
      - name: Install latest Slimefun Legacy release into Maven local
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEP_DIR="$RUNNER_TEMP/slimefun-legacy"
          mkdir -p "$DEP_DIR"
          TAG="$(gh api repos/wickidcow/Slimefun-Legacy/releases/latest --jq '.tag_name')"
          ASSET_NAME="$(gh api repos/wickidcow/Slimefun-Legacy/releases/latest --jq '.assets[] | select(.name | endswith(".jar")) | .name' | head -n 1)"
          test -n "$TAG"
          test -n "$ASSET_NAME"
          gh release download "$TAG" --repo wickidcow/Slimefun-Legacy --pattern "$ASSET_NAME" --dir "$DEP_DIR"
          test -s "$DEP_DIR/$ASSET_NAME"
          mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="$DEP_DIR/$ASSET_NAME" -DgroupId=com.github.slimefun -DartifactId=Slimefun -Dversion=Legacy-SNAPSHOT -Dpackaging=jar -DgeneratePom=true
      - name: Verify Paper 1.21.11 baseline compilation
        working-directory: idreamofeasy
        run: mvn -B clean package -Dpaper.version=1.21.11-R0.1-SNAPSHOT -Dmaven.compiler.showDeprecation=true
      - name: Verify Paper 26.2 compilation
        working-directory: idreamofeasy
        run: mvn -B clean package "-Dpaper.version=[26.2.build,26.3)" -Dmaven.compiler.showDeprecation=true
      - name: Verify Paper 26.3 alpha compilation
        working-directory: idreamofeasy
        run: mvn -B clean package -Dpaper.version=26.3-rc-3.build.1-alpha -Dmaven.compiler.showDeprecation=true
      - name: Build universal Java 21 release JAR
        working-directory: idreamofeasy
        run: mvn -B clean package -Dpaper.version=1.21.11-R0.1-SNAPSHOT
      - name: Stage and verify versioned JAR
        working-directory: idreamofeasy
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="target/${OUTPUT_NAME}"
          OUTPUT="dist/${OUTPUT_NAME}"
          test -s "$SOURCE"
          mkdir -p dist
          cp "$SOURCE" "$OUTPUT"
          jar tf "$OUTPUT" >/dev/null
          if jar tf "$OUTPUT" | grep -qi 'guizhan'; then exit 1; fi
          PLUGIN_YML="$(unzip -p "$OUTPUT" plugin.yml)"
          grep -q '^version: 1.0.3$' <<< "$PLUGIN_YML"
          grep -q '^folia-supported: true$' <<< "$PLUGIN_YML"
          MAIN_CLASS=$(awk '/^main:/ {print $2; exit}' <<< "$PLUGIN_YML")
          test -n "$MAIN_CLASS"
          javap -verbose -classpath "$OUTPUT" "$MAIN_CLASS" | grep -Fq 'major version: 65'
          sha256sum "$OUTPUT"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: idreamofeasy/dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        working-directory: idreamofeasy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          NOTES="IDreamOfEasy 1.0.3 adds Paper 26.3 alpha compatibility validation while preserving Folia-safe scheduler work, Java 21 universal bytecode, a Paper 1.21.11 release baseline, and Paper 26.2 as the primary production target. Maven now emits ${OUTPUT_NAME} directly."
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" "$JAR" --clobber; else gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --notes "$NOTES" --title "SF_IDreamOfEasy $TAG"; fi
